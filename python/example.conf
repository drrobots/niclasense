# Every main.py switch, as a config file:  python main.py --config example.conf
#
# Anything given on the command line overrides what is here, so a file describes a
# standing setup and flags vary one run of it. Section headers are for reading only --
# any key works under any heading, and keys before the first heading are fine too.
#
# Values shown are the defaults; delete the lines you are not changing.

[capture]
# Serial device. Leave unset to auto-detect by USB VID/PID.
# port = /dev/cu.usbmodemEE7B25F12

# Baud to try first. The sketch boots at 1000000, the nRF52832's hardware maximum, and
# 115200 cannot carry 200 Hz -- see the throughput section of the README.
baud = 1000000

# Fail rather than trying other rates when the baud above yields nothing.
no_autobaud = false

# Ask the board to stream at this many Hz on connect; 0 leaves it at its 200 Hz ceiling.
# Lower it only for a host that cannot carry 1 Mbaud: it caps what a burst can capture.
rate = 0

# CSV to append to. Unset means logs/nicla_<timestamp>.csv; "none" disables logging.
# csv = runs/walk.csv

# Stop after this many seconds. 0 runs until Ctrl-C. Headless only.
duration = 0

[burst]
# Thin the *file* to this many Hz. 0 logs every sample. The board keeps streaming at
# 200 Hz either way, so a trigger can still record at full rate -- and this adds a
# `burst` column, which makes the log append-incompatible with a full-rate one.
log_rate = 0

# Columns whose departure from their own baseline starts a full-rate burst, one
# `column:threshold` per line. Unset uses the accelerometer and gyroscope axes.
# Note: --burst-on on the command line ADDS to this list rather than replacing it.
# burst_on =
#     ax_g:0.15
#     gz_dps:25
#     press_hPa:0.5

# Seconds of full-rate logging after the last trigger.
burst_hold = 1.0

# Seconds of full-rate history kept from *before* each trigger. This is why decimation
# happens on the host: the samples that prove something happened are already in hand.
burst_pre = 0.25

# Baseline time constant, seconds. Longer = slower to accept a new resting value, so
# sustained motion keeps triggering for longer.
burst_tau = 0.5

[plot]
# Seconds of history every tile scrolls. Editable live from the capture tile too.
window = 30

# Plot refresh rate. Ingest stays at 200 Hz regardless.
fps = 20

# Log without opening a window. Note that a file can turn this on but the command line
# cannot turn it back off -- there is no --plot to counter --no-plot with.
no_plot = false

# Serve the live stream for dashboard.py: true for 127.0.0.1:8765, an address for
# anything else, false for off. 0.0.0.0 opens it to an unauthenticated network.
listen = false
