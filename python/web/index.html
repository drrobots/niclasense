<!doctype html>
<!--
  The browser dashboard. Deliberately not a copy of the matplotlib window: same tiles and
  same palette, but a CSS grid that reflows instead of a fixed raster, and a theme the
  viewer picks rather than one baked in at render time.

  Everything below the header is built by app.js from /spec, so the tile list lives only in
  tiles.py. The markup here is the frame around it.
-->
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Nicla Sense ME</title>
<link rel="stylesheet" href="uPlot.min.css">
<link rel="stylesheet" href="dash.css">
</head>
<body>

<header class="bar">
  <div class="brand">
    <h1>NICLA SENSE ME</h1>
    <p id="source">connecting&hellip;</p>
  </div>
  <!-- The capture's own state, filled by app.js from the status events. It lives in the
       header rather than in a tile because it is not a sensor: it is the answer to "is
       this working", which belongs where you look first and on every screen width, not in
       a cell competing with the traces for space. -->
  <div id="capture" class="capture-bar"></div>

  <div class="controls">
    <span id="clock" class="clock">t + 0.0 s</span>
    <label class="control">
      window
      <select id="window"></select>
    </label>
    <!-- Hidden until app.js finds a tile in /spec declaring an alt_unit, so the frame
         does not promise a control the layout may not have a use for. -->
    <button id="units" class="control" type="button" title="Switch units" hidden></button>
    <button id="theme" class="control" type="button" title="Switch theme">theme</button>
  </div>
</header>

<!-- Shown over the grid when the stream drops; the tiles stay visible behind it, frozen
     on their last samples, because a blank page loses what you were looking at. -->
<div id="notice" class="notice" hidden></div>

<main id="grid" class="grid"></main>

<script src="uPlot.iife.min.js"></script>
<script src="app.js"></script>
</body>
</html>
