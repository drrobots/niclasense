# The installed capture's standing setup, read by the Windows service on every start.
#
# Written to %ProgramData%\NiclaSense\nicla.conf, and left alone by an upgrade -- the
# installer only creates it if it is not already there, so a tuned setup survives. Every
# key here is a main.py flag; python\example.conf documents the full set.
#
# Restart the service after editing:
#     sc stop NiclaCapture && sc start NiclaCapture

[capture]
# Left unset deliberately, and this is the least obvious thing in the file. Unset means
# main.py names each capture logs\nicla_<timestamp>.csv, relative to the working directory,
# which the service sets to %ProgramData%\NiclaSense -- so the logs land in
#
#     %ProgramData%\NiclaSense\logs\
#
# A fixed path here would look tidier and would be a trap: every restart would append to
# one file, and the retention sweep never deletes the file being written. That file would
# grow without limit, which is exactly what the limits below exist to prevent.
# csv =

# The board is pinned at its 200 Hz ceiling. Unchanged from the default, stated because
# the decimation below only makes sense against a known stream rate.
rate = 0

[burst]
# One row a minute at rest. 1/60 Hz: about 100 MB a year, against the 3.2 GB a day an
# undecimated capture writes. The board still streams at 200 Hz and the dashboard still
# sees all of it -- this thins the file only.
log_rate = 0.0166667

# ...and full rate whenever something happens, which is the half that makes the low steady
# rate acceptable. Defaults to the accelerometer and gyroscope axes; add columns here to
# widen it. A quarter second of pre-trigger history is kept, which is why the host
# decimates rather than asking the board for a slow stream.
burst_hold = 1.0
burst_pre = 0.25
burst_tau = 0.5

[retention]
# Keep a year, and never more than 4 GB. The ceiling is sized for a year of resting data
# (~100 MB) plus a full day of solid bursting (~3.3 GB) -- so under any ordinary use the
# age limit is what applies, and the ceiling only bites for a board left somewhere that
# vibrates. Oldest first, and never the file being written. See the README's retention
# section for the arithmetic.
retain_days = 365
retain_gb = 4

[plot]
# Where the stream is served. The dashboard attaches here at login; loopback crosses the
# session boundary, so a service in session 0 and a dashboard in the user's session need
# nothing else. 0.0.0.0 would put an unauthenticated live feed of this machine's sensors on
# the network -- do not, without deciding to.
listen = 127.0.0.1:8765

# Off, and it must stay off. The dashboard is started by the logon task, in the user's
# session, where there is a browser and a desktop. A dashboard started from here would run
# in session 0 with nothing to show it to, and would take the capture's HTTP port with it.
plot = false
